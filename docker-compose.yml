# 本機開發用。正式環境依交接規格第 7 節部署於 GCP/AWS 台灣區域。
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: anhao
      POSTGRES_PASSWORD: anhao
      POSTGRES_DB: anhao
    ports: ["5432:5432"]
    volumes: ["anhao-pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  anhao-pg:
